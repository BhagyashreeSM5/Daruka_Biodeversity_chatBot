<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Darukaa.Earth — Biodiversity Intelligence Chatbot</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 30px auto; background: #f5f7f2; color: #1c2b1a; padding: 0 16px; }
  h1 { font-size: 1.3rem; margin-bottom: 4px; }
  nav a { color: #3a6b35; text-decoration: none; font-size: 0.9rem; }
  .tabs { display: flex; gap: 6px; margin: 14px 0 10px; }
  .tab-btn { padding: 8px 14px; border: 1px solid #b7c4ae; background: #eef2e9; border-radius: 6px 6px 0 0; cursor: pointer; font-size: 0.9rem; }
  .tab-btn.active { background: white; border-bottom-color: white; font-weight: 600; }
  .panel { display: none; }
  .panel.active { display: block; }
  #log { border: 1px solid #cfd9c8; border-radius: 8px; padding: 16px; height: 360px; overflow-y: auto; background: white; white-space: pre-wrap; }
  .msg { margin-bottom: 14px; }
  .user { color: #2b5c2b; font-weight: 600; }
  .bot { color: #1c2b1a; }
  form.chatform { display: flex; gap: 8px; margin-top: 12px; }
  input, textarea, select { padding: 9px; border-radius: 6px; border: 1px solid #b7c4ae; font-family: inherit; }
  input[type=text] { flex: 1; }
  button { padding: 9px 16px; border-radius: 6px; border: none; background: #3a6b35; color: white; cursor: pointer; font-size: 0.9rem; }
  button.secondary { background: #6b7c66; }
  #meta { font-size: 0.8rem; color: #667; margin-top: 8px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: white; border: 1px solid #cfd9c8; border-radius: 8px; padding: 16px; }
  .form-grid label { font-size: 0.85rem; display: block; margin-bottom: 3px; }
  .form-grid .field { display: flex; flex-direction: column; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .example-btn { background: white; border: 1px solid #8fa886; color: #2b5c2b; border-radius: 16px; padding: 6px 12px; font-size: 0.82rem; cursor: pointer; }
  textarea#jsonInput { width: 100%; height: 140px; font-family: monospace; font-size: 0.85rem; }
</style>
</head>
<body>
  <nav><a href="/knowledge">📚 Browse the Knowledge Base &rarr;</a></nav>
  <h1>🌱 Darukaa.Earth — Biodiversity Intelligence Chatbot</h1>

  <div class="examples" id="examples"></div>

  <div class="tabs">
    <div class="tab-btn active" data-tab="chat">Chat</div>
    <div class="tab-btn" data-tab="form">Guided Form</div>
    <div class="tab-btn" data-tab="json">Raw JSON</div>
  </div>

  <!-- CHAT PANEL -->
  <div class="panel active" id="panel-chat">
    <div id="log"></div>
    <form class="chatform" id="chatform">
      <input type="text" id="input" placeholder="e.g. Biodiversity is declining on my land" autocomplete="off" />
      <button type="submit">Send</button>
    </form>
    <div id="meta"></div>
  </div>

  <!-- GUIDED FORM PANEL -->
  <div class="panel" id="panel-form">
    <div class="form-grid">
      <div class="field"><label>Soil organic carbon (%)</label><input type="number" step="0.01" id="f_soc" /></div>
      <div class="field"><label>Soil pH (optional)</label><input type="number" step="0.1" id="f_ph" /></div>
      <div class="field"><label>Soil moisture (optional)</label>
        <select id="f_moisture"><option value="">—</option><option>low</option><option>medium</option><option>high</option></select>
      </div>
      <div class="field"><label>Rainfall</label>
        <select id="f_rainfall"><option value="">—</option><option>low</option><option>medium</option><option>high</option></select>
      </div>
      <div class="field"><label>Land use</label><input type="text" id="f_landuse" placeholder="e.g. monoculture wheat" /></div>
      <div class="field"><label>Region / climate zone</label><input type="text" id="f_region" placeholder="e.g. semi-arid" /></div>
      <div class="field"><label>Latitude (optional)</label><input type="number" step="0.0001" id="f_lat" /></div>
      <div class="field"><label>Longitude (optional)</label><input type="number" step="0.0001" id="f_lon" /></div>
    </div>
    <div style="margin-top: 12px;"><button id="submitForm">Get recommendations</button></div>
    <div id="formResult" style="margin-top: 14px; white-space: pre-wrap;"></div>
  </div>

  <!-- JSON PANEL -->
  <div class="panel" id="panel-json">
    <textarea id="jsonInput" placeholder='{"soil_organic_carbon_pct": 0.3, "rainfall": "low", "land_use": "monoculture wheat", "region": "semi-arid"}'></textarea>
    <div style="margin-top: 10px;"><button id="submitJson">Submit JSON</button></div>
    <div id="jsonResult" style="margin-top: 14px; white-space: pre-wrap;"></div>
  </div>

<script>
const sessionId = "web-" + Math.random().toString(36).slice(2);

// ---- tabs ----
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
  });
});

// ---- chat ----
const log = document.getElementById("log");
const meta = document.getElementById("meta");

function append(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = (role === "user" ? "You: " : "Bot: ") + text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

document.getElementById("chatform").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = document.getElementById("input");
  const message = input.value.trim();
  if (!message) return;
  append("user", message);
  input.value = "";
  const res = await fetch("/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: sessionId, message }),
  });
  const data = await res.json();
  append("bot", data.reply);
  meta.textContent = `status: ${data.status}` +
    (data.missing_fields.length ? ` | still need: ${data.missing_fields.join(", ")}` : "");
});

// ---- guided form ----
function collectForm() {
  const val = (id) => document.getElementById(id).value;
  const num = (id) => val(id) === "" ? null : parseFloat(val(id));
  const str = (id) => val(id) === "" ? null : val(id);
  return {
    soil_organic_carbon_pct: num("f_soc"),
    soil_ph: num("f_ph"),
    soil_moisture: str("f_moisture"),
    rainfall: str("f_rainfall"),
    land_use: str("f_landuse"),
    region: str("f_region"),
    latitude: num("f_lat"),
    longitude: num("f_lon"),
  };
}

function fillForm(data) {
  const set = (id, v) => document.getElementById(id).value = (v ?? "");
  set("f_soc", data.soil_organic_carbon_pct);
  set("f_ph", data.soil_ph);
  set("f_moisture", data.soil_moisture);
  set("f_rainfall", data.rainfall);
  set("f_landuse", data.land_use);
  set("f_region", data.region);
  set("f_lat", data.latitude);
  set("f_lon", data.longitude);
}

async function submitStructured(data, resultEl) {
  resultEl.textContent = "Thinking…";
  const res = await fetch(`/chat/structured?session_id=${sessionId}-struct-${Date.now()}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data),
  });
  const out = await res.json();
  resultEl.textContent = out.reply;
}

document.getElementById("submitForm").addEventListener("click", () => {
  submitStructured(collectForm(), document.getElementById("formResult"));
});

document.getElementById("submitJson").addEventListener("click", () => {
  const resultEl = document.getElementById("jsonResult");
  try {
    const data = JSON.parse(document.getElementById("jsonInput").value);
    submitStructured(data, resultEl);
  } catch (err) {
    resultEl.textContent = "Invalid JSON: " + err.message;
  }
});

// ---- preloaded examples ----
async function loadExamples() {
  const res = await fetch("/api/examples");
  const examples = await res.json();
  const container = document.getElementById("examples");
  examples.forEach(ex => {
    const btn = document.createElement("button");
    btn.className = "example-btn";
    btn.textContent = ex.label;
    btn.addEventListener("click", () => {
      document.querySelector('.tab-btn[data-tab="form"]').click();
      fillForm(ex.data);
      document.getElementById("jsonInput").value = JSON.stringify(ex.data, null, 2);
    });
    container.appendChild(btn);
  });
}
loadExamples();
</script>
</body>
</html>
